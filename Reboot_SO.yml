---
- name: Rebotear SO
  hosts: all
  
  tasks:  
    - name: Reboot a slow machine that might have lots of updates to apply
      win_reboot:
        reboot_timeout: 3600
        msg: "Reiniciando equipo por ansible."
      when: ansible_facts['os_family'] == "Windows"
  
    - name: rebotear el servidor Linux
      command: shutdown -r now
      when: ansible_facts['os_family'] != "Windows"
      
      